<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { width: 100%; max-width: 400px; padding: 20px; }
    </style>
</head>
<body>
    <div class="card shadow">
        <div class="card-body text-center">
            <h3>✉️ Verify Email</h3>
            <p class="text-muted">We sent a 6-digit code to your email (Check the terminal!).</p>

            <div class="mb-3">
                <input type="text" id="code" class="form-control text-center fs-4" placeholder="123456" maxlength="6">
            </div>
            <button class="btn btn-primary w-100" onclick="verify()">Activate Account</button>
        </div>
    </div>

    <script>
        // משיכת שם המשתמש מהכתובת (URL) כדי שנדע את מי לאמת
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('user');

        async function verify() {
            const code = document.getElementById('code').value;

            const res = await fetch('/verify-account', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: username, code: code })
            });

            if (res.ok) {
                alert("Account Verified! Welcome.");
                window.location.href = '/'; // מעבר לדף הבית
            } else {
                alert("Wrong code! Check the terminal again.");
            }
        }
    </script>
</body>
</html>
