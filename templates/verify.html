<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<script>
    // בדיקה מיידית של ערכת הנושא כדי למנוע הבהוב לבן בטעינה
    (function() {
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
    })();
</script>
<head>
    <meta charset="UTF-8">
    <title>Verify Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { width: 100%; max-width: 400px; padding: 20px; }
        /* --- Dark Mode Custom Overrides --- */
        [data-bs-theme="dark"] body {
            background-color: #121212 !important;
            color: #e0e0e0;
        }
        [data-bs-theme="dark"] .card,
        [data-bs-theme="dark"] .stat-box,
        [data-bs-theme="dark"] .order-card,
        [data-bs-theme="dark"] .review-card {
            background-color: #1e1e1e !important;
            color: #fff !important;
            border-color: #333 !important;
        }
        [data-bs-theme="dark"] .list-group-item {
            background-color: #1e1e1e;
            color: #fff;
            border-color: #333;
        }
        [data-bs-theme="dark"] .navbar {
            border-bottom: 1px solid #333;
        }
        [data-bs-theme="dark"] .bg-white, [data-bs-theme="dark"] .bg-light {
            background-color: #1e1e1e !important;
        }
        [data-bs-theme="dark"] .text-muted {
            color: #aaa !important;
        }
    </style>

</head>
<body>
    <div class="card shadow">
        <div class="card-body text-center">
            <h3>✉️ Verify Email</h3>
            <p class="text-muted">We sent a 6-digit code to your email (Check the terminal!).</p>

            <div class="mb-3">
                <input type="text" id="code" class="form-control text-center fs-4" placeholder="123456" maxlength="6">
            </div>
            <button class="btn btn-primary w-100" onclick="verify()">Activate Account</button>
        </div>
    </div>

    <script>
        // פונקציה להחלפת ערכת הנושא
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            document.documentElement.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeUI(newTheme);
        }

        // עדכון האייקון והממשק
        function updateThemeUI(theme) {
            const icon = document.getElementById('themeIcon');
            if (icon) {
                icon.innerText = theme === 'dark' ? '☀️' : '🌙';
            }
        }

        // הרצה ראשונית כשהדף נטען
        document.addEventListener('DOMContentLoaded', () => {
            const currentTheme = document.documentElement.getAttribute('data-bs-theme');
            updateThemeUI(currentTheme);
        });
        // משיכת שם המשתמש מהכתובת (URL) כדי שנדע את מי לאמת
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('user');

        async function verify() {
            const code = document.getElementById('code').value;

            const res = await fetch('/verify-account', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: username, code: code })
            });

            if (res.ok) {
                alert("Account Verified! Welcome.");
                window.location.href = '/'; // מעבר לדף הבית
            } else {
                alert("Wrong code! Check the terminal again.");
            }
        }
    </script>
</body>
</html>
